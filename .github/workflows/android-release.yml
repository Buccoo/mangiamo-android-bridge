name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing files
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          cat > keystore.properties <<'EOF'
          storeFile=./release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Validate bridge runtime secrets
        run: |
          set -euo pipefail
          test -n "${{ secrets.BRIDGE_SUPABASE_URL }}"
          test -n "${{ secrets.BRIDGE_SUPABASE_ANON_KEY }}"

      - name: Build release APK
        env:
          BRIDGE_SUPABASE_URL: ${{ secrets.BRIDGE_SUPABASE_URL }}
          BRIDGE_SUPABASE_ANON_KEY: ${{ secrets.BRIDGE_SUPABASE_ANON_KEY }}
        run: gradle :app:assembleRelease

      - name: Prepare release artifact name
        run: |
          set -euo pipefail
          SOURCE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$SOURCE_APK" app/build/outputs/apk/release/mangiamo-android-bridge.apk
          cp "$SOURCE_APK" app/build/outputs/apk/release/sushiamo-android-bridge.apk

      - name: Verify existing production signing certificate
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          CERT_SHA256=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/mangiamo-android-bridge.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$CERT_SHA256" = "8cf9c92ef64895c4be657123c4be6d40b88ae9359e38c2e351fbb04e713be1b6"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangiamo-android-bridge-apk
          path: |
            app/build/outputs/apk/release/mangiamo-android-bridge.apk
            app/build/outputs/apk/release/sushiamo-android-bridge.apk

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/mangiamo-android-bridge.apk
            app/build/outputs/apk/release/sushiamo-android-bridge.apk
          generate_release_notes: true
